<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Odoo View DSL · Designer (canvas)</title>
<link rel="stylesheet" href="odoo.css" />
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ajv@8.12.0/dist/ajv.min.js"></script>
<style>
  :root{
    --bg:#f1f5f9; --card:#ffffff; --border:#e2e8f0; --border2:#cbd5e1;
    --text:#0f172a; --muted:#64748b; --accent:#2563eb; --danger:#dc2626; --ok:#16a34a;
    --amber:#b45309; --canvas:#eef2f6;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.6 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--text);background:var(--bg)}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--card);display:flex;align-items:baseline;gap:12px}
  header h1{font-size:15px;margin:0}
  header p{margin:0;color:var(--muted);font-size:12px}
  .pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:#e2e8f0;color:#334155;margin-left:6px}
  .wrap{display:flex;gap:0;height:calc(100vh - 49px)}
  .col{overflow:auto;padding:14px}
  .col.left{flex:0 0 250px;border-right:1px solid var(--border);background:var(--card)}
  .col.center{flex:1 1 auto;background:var(--canvas);min-width:0}
  .col.right{flex:0 0 380px;border-left:1px solid var(--border);background:var(--card)}

  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px}
  .card h2{font-size:12px;margin:0 0 9px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
  input,select,textarea{width:100%;padding:6px 8px;border:1px solid var(--border2);border-radius:8px;
    font:inherit;color:var(--text);background:#fff}
  textarea{resize:vertical;min-height:48px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .row{display:flex;gap:8px}.row>*{flex:1}
  button{cursor:pointer;border:1px solid var(--border2);background:#fff;color:var(--text);
    padding:6px 10px;border-radius:8px;font:inherit}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.danger{color:var(--danger);border-color:#fecaca}
  button.sm{padding:3px 8px;font-size:12px}
  .muted{color:var(--muted);font-size:12px}
  .muted.pad{padding:6px 0;font-style:italic}
  .typebadge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#e0f2fe;color:#075985;margin:4px 0 2px}
  .cv-field .typebadge{grid-column:1 / -1;margin:0}
  .typebadge.warn{background:#fef3c7;color:#78350f}
  .checkrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0}
  label.chk{display:inline-flex;align-items:center;gap:5px;margin:0;width:auto;font-size:12px;color:var(--text);cursor:pointer}
  label.chk input{width:auto}
  .modlist{margin-top:4px}
  .moditem{font-size:12px;color:var(--text);background:#f1f5f9;border:1px solid var(--border);border-radius:8px;padding:5px 9px;margin-bottom:5px}

  /* 工具箱：字段面板 */
  .palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{font-size:12px;padding:4px 9px;border:1px solid var(--border2);border-radius:999px;background:#f8fafc;cursor:grab;user-select:none}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip:active{cursor:grabbing}
  .chip .t{color:var(--muted);font-size:10px;margin-left:4px}
  .addbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .tree{font-size:12px;font-family:ui-monospace,Menlo,monospace;color:var(--muted);white-space:pre;margin-top:6px;max-height:200px;overflow:auto}

  /* 画布 */
  .canvas-bar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--card)}
  .canvas-bar .hint{color:var(--muted);font-size:12px}
  .canvas{padding:18px;min-height:calc(100% - 45px)}
  .sheet{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(15,23,42,.08);padding:18px;max-width:760px;margin:0 auto}
  .sheet-head{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;display:flex;justify-content:space-between}
  .cv-group{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:10px 0}
  .cv-group.sel{border-color:var(--accent);box-shadow:0 0 0 2px #bfdbfe55}
  .cv-group > .cv-title{font-weight:600;font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;cursor:pointer}
  .cv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 20px}
  @media(max-width:1100px){.cv-grid{grid-template-columns:1fr !important}}
  .cv-field{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:10px;padding:5px 7px;border:1px solid transparent;border-radius:7px;cursor:pointer}
  .cv-field .cv-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cv-field:hover{background:#f8fafc;border-color:var(--border)}
  .cv-field.sel{border-color:var(--accent);background:#eff6ff}
  .cv-label{font-size:12px;color:#334155}
  .cv-label .req{color:var(--danger)}
  .cv-ctl{border:1px solid var(--border2);border-radius:6px;background:#fff;min-height:30px;padding:4px 8px;font-size:12px;color:var(--muted);display:flex;align-items:center}
  .cv-ctl.ta{min-height:46px}
  .cv-ctl.bool{background:#fff}
  .cv-ctl.m2o::after{content:"🔍";margin-left:auto;opacity:.5}
  .cv-ctl.x2m{background:#f8fafc;color:var(--muted)}
  .cv-notebook{border:1px solid var(--border);border-radius:10px;margin:10px 0;overflow:hidden}
  .cv-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);background:#f8fafc}
  .cv-tab{padding:7px 14px;font-size:12px;cursor:pointer;border-bottom:2px solid transparent}
  .cv-tab.active{background:#fff;border-bottom-color:var(--accent);color:var(--accent);font-weight:600}
  .cv-page{padding:12px}
  .cv-button{display:inline-block;padding:5px 14px;border-radius:7px;background:var(--accent);color:#fff;font-size:12px;cursor:pointer}
  .cv-separator{border-top:1px solid var(--border2);margin:12px 0;position:relative;text-align:center}
  .cv-separator span{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:#fff;padding:0 8px;font-size:11px;color:var(--muted)}
  .cv-label-el{font-size:13px;font-weight:600;color:var(--text);margin:8px 0}
  .cv-logic{font-size:11px;color:var(--amber);background:#fffbeb;border:1px dashed #fde68a;border-radius:6px;padding:4px 8px;margin:6px 0}
  .cv-dropzone{border:2px dashed var(--border2);border-radius:8px;padding:9px;text-align:center;color:var(--muted);font-size:12px;margin:8px 0;transition:.1s}
  .cv-dropzone.over{border-color:var(--accent);background:#eff6ff;color:var(--accent)}

  /* 检查器 / 输出 */
  .insp-title{font-size:13px;font-weight:600;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
  .status{padding:8px 10px;border-radius:8px;font-size:13px;margin-bottom:10px}
  .status.ok{background:#dcfce7;color:#14532d;border:1px solid #bbf7d0}
  .status.err{background:#fee2e2;color:#7f1d1d;border:1px solid #fecaca}
  .status.warn{background:#fef3c7;color:#78350f;border:1px solid #fde68a}
  ul.errs{margin:6px 0 0;padding-left:18px}.errs li{color:var(--danger);font-size:12px}
  pre{background:#0f172a;color:#e2e8f0;padding:10px;border-radius:10px;overflow:auto;font-size:11px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;max-height:340px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .toolbar .grow{flex:1}
  details summary{cursor:pointer;color:var(--accent);font-size:12px}
  code{background:#eef2ff;padding:1px 5px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Odoo View DSL · Designer <span class="pill">canvas</span></h1>
  <p>画布式：左=工具箱，中=画布（所见即所得），右=检查器+DSL。设计器只产出 DSL，转换交给 <code>oview.pipeline</code>。</p>
</header>

<div class="wrap">
  <div class="col left" id="left"></div>

  <div class="col center">
    <div class="canvas-bar" id="canvasBar"></div>
    <div class="canvas" id="canvas"></div>
  </div>

  <div class="col right" id="right"></div>
</div>

<script src="app.js"></script>
</body>
</html>
